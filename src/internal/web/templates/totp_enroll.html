<!DOCTYPE html>
<html lang="{{.UILanguage}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{if .PageTitle}}{{.PageTitle}}{{else}}{{.UI.signin}}{{end}} - {{.Title}}</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/auth-ui.css"><script defer src="/assets/qrcode.min.js"></script><script defer src="/assets/auth-ui.js"></script></head>
<body><main class="card"><div id="auth-ui-config" hidden data-locale="{{.UILanguage}}" data-messages="{{.UIMessages}}" data-debug="{{.Debug}}"></div>
<div id="error-container" class="message" role="alert" aria-atomic="true"></div>
<h1>{{.UI.bind}}</h1><p>{{.UI.bind_hint}}</p><div id="qrcode" data-uri="{{.OtpauthURI}}"></div><form id="confirmForm" method="post" action="/totp/enroll/confirm"><input type="hidden" name="enroll_id" value="{{.EnrollID}}"><label for="code">{{.UI.totp}}</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><button type="submit">{{.UI.confirm}}</button></form><section id="backupCodes" tabindex="-1" hidden><h2>{{.UI.recovery}}</h2><p id="backupHint">{{.UI.backup_hint}}</p><ul id="backupCodesList"></ul><button type="button" id="copyCodes">{{.UI.copy}}</button><button type="button" id="downloadCodes">{{.UI.download}}</button><p class="check"><input type="checkbox" id="codesSaved"><label for="codesSaved">{{.UI.saved}}</label></p><a id="savedHome" href="/" hidden>{{.UI.home}}</a></section><footer><p><a href="/_account?lang={{.UILanguage}}">{{.UI.account}}</a></p><form data-logout method="post" action="/_logout"><button type="submit">{{.UI.logout}}</button></form>{{if .SupportURL}}<p><a href="{{.SupportURL}}" rel="noreferrer">{{.UI.contact}}</a></p>{{end}}<p>{{.FooterText}}</p></footer></main></body></html>
