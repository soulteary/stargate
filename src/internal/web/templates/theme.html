{{define "theme-head"}}{{with .Theme}}<link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="{{.BaseURL}}/tokens.css">{{end}}{{end}}
{{define "theme-brand"}}{{with .Theme}}<aside class="auth-brand" aria-label="{{.Name}}">{{if .ImageURL}}<img class="auth-brand-image" src="{{.ImageURL}}" alt="" width="1200" height="1600" fetchpriority="high">{{end}}<div class="auth-brand-name">{{$.Title}}</div><div class="auth-brand-copy">{{if .Brand.Eyebrow}}<p class="auth-eyebrow">{{.Brand.Eyebrow}}</p>{{end}}{{if .Brand.Heading}}<h2>{{.Brand.Heading}}</h2>{{end}}{{if .Brand.Caption}}<p class="auth-caption">{{.Brand.Caption}}</p>{{end}}</div></aside>{{end}}{{end}}
