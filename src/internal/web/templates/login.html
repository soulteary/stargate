<!DOCTYPE html>
<html lang="{{.UILanguage}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.UI.signin}} - {{.Title}}</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/auth-ui.css"><script defer src="/assets/auth-ui.js"></script></head>
<body><main class="card"><div id="auth-ui-config" hidden data-locale="{{.UILanguage}}" data-messages="{{.UIMessages}}" data-debug="{{.Debug}}"></div>
<div id="error-container" class="message" role="alert" aria-atomic="true"></div>
<h1>{{.UI.signin}}</h1><form id="passwordOnlyForm" action="/_login" method="post"><input type="hidden" name="auth_method" value="password">{{if .ExchangeState}}<input type="hidden" name="exchange_state" value="{{.ExchangeState}}">{{end}}{{if .Callback}}<input type="hidden" name="callback" value="{{.Callback}}">{{end}}<label for="password">{{.UI.password}}</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">{{.UI.signin}}</button></form><footer>{{if .SupportURL}}<p><a href="{{.SupportURL}}" rel="noreferrer">{{.UI.contact}}</a></p>{{end}}<p>{{.FooterText}}</p></footer></main></body></html>
