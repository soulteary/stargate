<!DOCTYPE html>
<html lang="{{.UILanguage}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{if .PageTitle}}{{.PageTitle}}{{else}}{{.UI.signin}}{{end}} - {{.Title}}</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/auth-ui.css"><script defer src="/assets/auth-ui.js"></script></head>
<body><main class="card"><div id="auth-ui-config" hidden data-locale="{{.UILanguage}}" data-messages="{{.UIMessages}}" data-debug="{{.Debug}}"></div>
<div id="error-container" class="message" role="alert" aria-atomic="true"></div>
<h1>{{.UI.account}}</h1>{{if .HeraldTOTPEnabled}}<p><a href="/totp/enroll?lang={{.UILanguage}}">{{.UI.bind}}</a></p><p><a href="/totp/revoke?lang={{.UILanguage}}">{{.UI.revoke}}</a></p>{{end}}<footer><p><a href="/_account?lang={{.UILanguage}}">{{.UI.account}}</a></p><form data-logout method="post" action="/_logout"><button type="submit">{{.UI.logout}}</button></form>{{if .SupportURL}}<p><a href="{{.SupportURL}}" rel="noreferrer">{{.UI.contact}}</a></p>{{end}}<p>{{.FooterText}}</p></footer></main></body></html>
