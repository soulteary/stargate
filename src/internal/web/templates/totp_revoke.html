<!DOCTYPE html>
<html lang="{{.UILanguage}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{if .PageTitle}}{{.PageTitle}}{{else}}{{.UI.signin}}{{end}} - {{.Title}}</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/auth-ui.css"><script defer src="/assets/auth-ui.js"></script></head>
<body><main class="card"><div id="auth-ui-config" hidden data-locale="{{.UILanguage}}" data-messages="{{.UIMessages}}" data-debug="{{.Debug}}"></div>
<div id="error-container" class="message" role="alert" aria-atomic="true"></div>
<h1>{{.UI.revoke}}</h1><p>{{.UI.revoke_hint}}</p><form id="revokeForm" method="post" action="/totp/revoke"><label for="password">{{.UI.password}}</label><input id="password" name="password" type="password" autocomplete="current-password"><p>{{.UI.or}}</p><label for="code">{{.UI.totp}} / {{.UI.recovery}}</label><input id="code" name="code" autocomplete="one-time-code" maxlength="19"><button type="submit">{{.UI.revoke}}</button></form><p><a href="/">{{.UI.home}}</a></p><footer><p><a href="/_account?lang={{.UILanguage}}">{{.UI.account}}</a></p><form data-logout method="post" action="/_logout"><button type="submit">{{.UI.logout}}</button></form>{{if .SupportURL}}<p><a href="{{.SupportURL}}" rel="noreferrer">{{.UI.contact}}</a></p>{{end}}<p>{{.FooterText}}</p></footer></main></body></html>
