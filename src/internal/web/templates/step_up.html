<!DOCTYPE html>
<html lang="{{.UILanguage}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{if .PageTitle}}{{.PageTitle}}{{else}}{{.UI.signin}}{{end}} - {{.Title}}</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/auth-ui.css"><script defer src="/assets/auth-ui.js"></script></head>
<body><main class="card"><div id="auth-ui-config" hidden data-locale="{{.UILanguage}}" data-messages="{{.UIMessages}}" data-debug="{{.Debug}}"></div>
<div id="error-container" class="message" role="alert" aria-atomic="true"></div>
<h1>{{.UI.step_up}}</h1><form data-native-once method="post" action="/_step_up">{{if .Reauth}}<p class="hint">{{index .UI (print "reauth_" .Reauth)}}</p>{{if eq .Reauth "password"}}<label for="password">{{.UI.password}}</label><input id="password" name="password" type="password" autocomplete="current-password" required>{{else if eq .Reauth "totp"}}<label for="code">{{.UI.totp}} / {{.UI.recovery}}</label><input id="code" name="code" autocomplete="one-time-code" maxlength="19" required>{{else}}<label for="deliver_via">{{.UI.channel}}</label><select id="deliver_via" name="deliver_via">{{if .LoginSMSEnabled}}<option value="sms">{{.UI.sms}}</option>{{end}}{{if .LoginEmailEnabled}}<option value="email">{{.UI.email}}</option>{{end}}<option value="dingtalk">{{.UI.dingtalk}}</option></select><label for="code">{{.UI.code}}</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><button id="reauthSendBtn" type="button">{{.UI.send}}</button>{{end}}{{end}}<input type="hidden" name="callback" value="{{.Callback}}"><input type="hidden" name="callback_host" value="{{.CallbackHost}}"><input type="hidden" name="callback_proto" value="{{.CallbackProto}}"><button type="submit">{{.UI.confirm}}</button></form><footer><p><a href="/_account?lang={{.UILanguage}}">{{.UI.account}}</a></p><form data-logout method="post" action="/_logout"><button type="submit">{{.UI.logout}}</button></form>{{if .SupportURL}}<p><a href="{{.SupportURL}}" rel="noreferrer">{{.UI.contact}}</a></p>{{end}}<p>{{.FooterText}}</p></footer></main></body></html>
