name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI_RECIPES_VERSION: 804758e6c692b56d1543ef447b6b319b517ab985

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Documentation, format, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) ;;
              *) code_changed=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "code=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Check documentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ci-recipes stargate check-doc-contracts "$BASE_SHA"
          ci-recipes stargate check-go-version-contract

      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null

      - name: Check release workflow contracts
        run: ci-recipes stargate check-release-workflow

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        if: steps.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=5m
          only-new-issues: false

      - name: Run unit tests
        if: steps.changes.outputs.code == 'true'
        run: go test -short ./...

      - name: Skip full checks for documentation-only changes
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation files changed; build checks are not required."
