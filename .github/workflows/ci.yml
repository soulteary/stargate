name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI_RECIPES_VERSION: 39e30dfe38566a87ff1b3e92e24743c2aac81df6

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Documentation, format, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) ;;
              *) code_changed=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "code=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Check documentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ci-recipes stargate check-doc-contracts "$BASE_SHA"
          ci-recipes stargate check-go-version-contract

      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null

      - name: Check release workflow contracts
        run: ci-recipes stargate check-release-workflow

      - name: Check local launcher contract
        run: bash .github/scripts/test-start-local.sh

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        if: steps.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m
          only-new-issues: false

      - name: Run unit tests
        if: (steps.changes.outputs.code == 'true') && (!(github.event_name == 'pull_request'))
        run: go test -short ./...

      - name: Remove stale generated report evidence
        if: "github.event_name == 'pull_request'"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "70"
          test_args: "-short -count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Skip full checks for documentation-only changes
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation files changed; build checks are not required."
      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
