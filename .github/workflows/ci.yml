name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI_RECIPES_VERSION: 4b909da4b11948a4de37b6423dae966c2ecb1941

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Documentation, format, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      redis_changed: ${{ steps.changes.outputs.redis }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) ;;
              *) code_changed=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "code=$code_changed" >> "$GITHUB_OUTPUT"
          redis_changed=false
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'src/internal/handlers/ratelimit*' .github/scripts/benchmark-redis.py .github/workflows/ci.yml; then
            redis_changed=true
          fi
          echo "redis=$redis_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Check documentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ci-recipes stargate check-doc-contracts "$BASE_SHA"
          ci-recipes stargate check-go-version-contract
          python3 .github/scripts/check-doc-runtime.py

      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null

      - name: Check release workflow contracts
        run: ci-recipes stargate check-release-workflow

      - name: Check local launcher contract
        run: |
          bash .github/scripts/test-start-local.sh
          sh .github/scripts/test-check-coverage.sh

      - name: Check full-stack deployment examples
        run: python3 -m unittest discover -s examples/full-stack -p 'test_*.py'

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        if: steps.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m
          only-new-issues: false

      - name: Run unit tests
        if: (steps.changes.outputs.code == 'true') && (!(github.event_name == 'pull_request'))
        run: go test -short ./...

      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.3)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "95"
          test_args: "-short -count=1"
          version: "v1.1.3"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.4)
        id: go_report_card
        uses: soulteary/goreportcard-action@d4669a9fbea514f5995d749177630ebfee755789  # v1.1.4
        with:
          directory: "."
          version: "v1.1.4"
          threshold: "0"
          report: "true"
          commit: "false"
        if: "!cancelled() && github.event_name == 'pull_request' && steps.report_cleanup.outcome == 'success'"
      - name: Regenerate language-aware Go report
        if: "!cancelled() && steps.go_report_card.outcome == 'success'"
        shell: bash
        run: sh .github/scripts/regenerate-report-card.sh
      - name: Restore project Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
          sh .github/scripts/check-coverage.sh coverage.out
      - name: Skip full checks for documentation-only changes
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation files changed; build checks are not required."
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read

  windows-startup:
    name: Windows startup tests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test startup and listener failures
        run: go test -short -timeout=2m ./src/cmd/stargate

  release-packaging:
    name: Release packaging / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o "dist/stargate-linux-${GOARCH}" ./src/cmd/stargate
      - name: Build release image
        run: docker build --pull -f docker/release.Dockerfile -t stargate:packaging-check .
      - name: Verify packaged binary and hardened runtime
        run: bash .github/scripts/test-release-image.sh stargate:packaging-check dist/stargate-linux-${{ matrix.arch }}

  redis-performance:
    needs: pr-checks
    if: needs.pr-checks.outputs.redis_changed == 'true'
    name: Redis performance / arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.1-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare precompiled revisions against the same Redis
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STARGATE_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: python3 .github/scripts/benchmark-redis.py --baseline "$BASE_SHA" --output "$RUNNER_TEMP/redis-performance"
      - name: Upload raw performance measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redis-performance-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/redis-performance
          retention-days: 30
