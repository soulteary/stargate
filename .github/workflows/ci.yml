name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Documentation, format, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) ;;
              *) code_changed=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "code=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Check documentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-doc-contracts.sh "$BASE_SHA"
          bash .github/scripts/test-doc-contracts.sh
          bash .github/scripts/test-go-version-contract.sh

      - name: Check release-note extraction
        run: |
          bash .github/scripts/test-release-notes.sh
          bash .github/scripts/test-release-workflow.sh

      - name: Check local launcher
        run: bash .github/scripts/test-start-local.sh

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        if: steps.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06c5925ef5d2fc7ad053ef454303e # v9
        with:
          version: v2.13.1
          args: --timeout=5m
          only-new-issues: false

      - name: Run unit tests
        if: steps.changes.outputs.code == 'true'
        run: go test -short ./...

      - name: Skip full checks for documentation-only changes
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation files changed; build checks are not required."
