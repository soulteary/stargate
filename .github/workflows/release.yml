name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布/覆盖的已存在 v* tag（例如 v1.2.3）'
        required: true
        type: string

concurrency:
  # Every release tag updates shared semver aliases. Serialize all tags so an
  # older run cannot finish last and overwrite latest, major, or minor tags.
  group: ${{ github.repository }}-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  compatibility:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: 1.27.0
            arch: amd64
          - os: ubuntu-24.04-arm
            go-version: 1.27.0
            arch: arm64
          - os: windows-latest
            go-version: 1.27.0
            arch: amd64
          - os: macos-15-intel
            go-version: 1.27.0
            arch: amd64
          - os: macos-latest
            go-version: 1.27.0
            arch: arm64
          - os: ubuntu-latest
            go-version: 1.27.x
            arch: amd64
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run cross-platform unit tests
        run: go test -short ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: compatibility
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release ref
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::release_tag 必须是形如 vX.Y.Z 的语义化 tag，实际为 '${TAG}'"
            exit 1
          fi
          # 手动触发：校验 tag 存在，且当前 HEAD 就是该 tag 指向的提交
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "manual=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

      - name: Check documentation contracts
        run: bash .github/scripts/check-doc-contracts.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13.1
          args: --timeout=5m
          only-new-issues: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.2.0

      - name: Scan Go dependencies
        run: govulncheck ./...

      - name: Start Redis for integration tests
        run: |
          docker run -d --name stargate-redis-release -p 6379:6379 redis:8.2.1-alpine3.22
          for i in $(seq 1 30); do
            if docker exec stargate-redis-release redis-cli ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs stargate-redis-release
          exit 1

      - name: Run tests with coverage gate
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 70) { printf "coverage %.1f%% is below 70%%\n", total; exit 1 } }'

      - name: Stop integration-test Redis
        if: always()
        run: docker rm -f stargate-redis-release 2>/dev/null || true

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ github.sha }}
          BUILD_DATE=$(date +%FT%T%z)
          LDFLAGS="-s -w -X 'github.com/soulteary/version-kit/v2.Version=${VERSION}' -X 'github.com/soulteary/version-kit/v2.Commit=${COMMIT}' -X 'github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE}'"
          
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-linux-amd64 ./src/cmd/stargate
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-linux-arm64 ./src/cmd/stargate
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-darwin-amd64 ./src/cmd/stargate
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-darwin-arm64 ./src/cmd/stargate
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-windows-amd64.exe ./src/cmd/stargate
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/stargate-windows-arm64.exe ./src/cmd/stargate

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/stargate-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist
          # Exclude checksums.txt itself: `sha256sum *` can sweep the manifest
          # into its own listing (a self-referential line whose hash never
          # matches the final file), which later makes `sha256sum -c` report
          # "checksums.txt: FAILED". Hash every artifact EXCEPT the manifest.
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 手动触发时 github.ref 为分支，semver/ref 无法解析 tag，
          # 因此统一改用 Resolve release ref 得到的 tag/version 生成别名。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') }}

      - name: Build amd64 image for security scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: stargate:release-scan-amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            ALPINE_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Never reuse cached layers when scanning: a cached `apk upgrade`
          # layer can pin outdated OS packages (e.g. openssl) and hide fixed
          # CVEs, so the scan must always rebuild against the latest Alpine
          # package snapshot.
          no-cache: true
          pull: true
          platforms: linux/amd64

      - name: Scan amd64 image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stargate:release-scan-amd64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build arm64 image for security scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: stargate:release-scan-arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            ALPINE_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Same reasoning as the amd64 scan build: force a fresh package
          # layer so vulnerability scans reflect the latest fixes.
          no-cache: true
          pull: true
          platforms: linux/arm64

      - name: Scan arm64 image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stargate:release-scan-arm64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            ALPINE_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Always pull the freshest Alpine base so the published image picks
          # up the same OS package fixes verified by the security scan above.
          pull: true
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,mode=max,scope=release-docker
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Prepare curated release notes
        run: bash .github/scripts/extract-release-notes.sh "${{ steps.release.outputs.tag }}" "$RUNNER_TEMP/release-notes.md"

      - name: Delete existing release for overwrite
        if: steps.release.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # 手动重发：删除同名 Release（保留 git tag），随后重新创建以覆盖。
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
