name: Real browser acceptance
on:
  pull_request:
    paths:
      - ".github/browser/**"
      - ".github/workflows/browser-acceptance.yml"
      # What the scenario builds and drives: the gateway image (docker/Dockerfile
      # over the Go sources, templates and assets that .dockerignore admits) and
      # the full-stack generator and Compose files. Test files and the example's
      # documentation are in neither.
      - "src/**"
      - "!src/**/*_test.go"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      - ".dockerignore"
      - "examples/full-stack/**"
      - "!examples/full-stack/**/*.md"
  workflow_dispatch:
    inputs:
      fullstack_ref:
        description: Full 40-character full-stack source commit (default, the dispatched commit)
        required: false
        type: string
      gateway_ref:
        description: Full 40-character gateway source commit (default, the dispatched commit)
        required: false
        type: string
      herald_image:
        description: Verified Herald 1.9.0 image canonical digest (retry metadata requires 1.5.0 or later)
        required: true
        type: string
permissions:
  contents: read
# A newer push to the same pull request replaces the run in progress. Each
# profile owns its stack on a runner that is discarded with the run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  # The product under test is the commit this run is for: the merge commit of
  # the pull request (the one the first checkout below uses), or the dispatched
  # commit. A dispatch may name other commits. No product commit is fixed here.
  FULLSTACK_REF: ${{ inputs.fullstack_ref || github.sha }}
  GATEWAY_REF: ${{ inputs.gateway_ref || github.sha }}
  HERALD_IMAGE: ${{ inputs.herald_image || 'ghcr.io/soulteary/herald@sha256:adc6b044433bea989a69ee422cc4e38d67a2d19cc2512fc70aeac1d284c8eafd' }}
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        appearance: [builtin, deep-space]
    env:
      BROWSER_THEME_DIR: ${{ matrix.appearance == 'deep-space' && format('{0}/theme-fixture/themes/deep-space', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        run: |
          python3 .github/browser/validate_inputs.py
          python3 -m unittest discover -s .github/browser -p 'test_*.py'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FULLSTACK_REF }}
          path: fullstack
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.GATEWAY_REF }}
          path: gateway
          persist-credentials: false
      - name: Check out native theme fixture
        if: matrix.appearance == 'deep-space'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soulteary/stargate-themes
          ref: 6ae0fd8a85f2544a72336c74beb9734434644c66
          path: theme-fixture
          persist-credentials: false
      - name: Set up Go for theme view checks
        if: matrix.appearance == 'deep-space'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Resolve owned loopback hosts for browser and HTTP clients
        run: |
          printf '127.0.0.1 auth.test.localhost hello.test.localhost\n' | sudo tee -a /etc/hosts > /dev/null
          python3 - <<'PYTHON'
          import ipaddress, socket
          for host in ("auth.test.localhost", "hello.test.localhost"):
              assert all(ipaddress.ip_address(item[4][0]).is_loopback for item in socket.getaddrinfo(host, 8088))
          PYTHON
      - name: Install Chromium test dependencies
        run: |
          python3 -m pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium
      - name: Check themed views and password sessions
        if: matrix.appearance == 'deep-space'
        run: python3 .github/browser/theme.py --theme "$BROWSER_THEME_DIR" --output "$RUNNER_TEMP/theme-evidence"
      - name: Start isolated real stack and run browser acceptance
        run: |
          set +e
          python3 .github/browser/run.py
          result=$?
          python3 - "$result" <<'PYTHON'
          import json, pathlib, sys
          path = pathlib.Path("browser-results.json")
          data = json.loads(path.read_text())
          data["process_exit_code"] = int(sys.argv[1])
          if int(sys.argv[1]) != 0:
              data["status"] = "failed"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYTHON
          exit "$result"
      - name: Upload redacted result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-acceptance-${{ matrix.appearance }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            browser-results.json
            browser-account.png
          if-no-files-found: error
      - name: Upload theme view evidence
        if: always() && matrix.appearance == 'deep-space'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: theme-views-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/theme-evidence/theme-results.json
            ${{ runner.temp }}/theme-evidence/theme-login-desktop.png
            ${{ runner.temp }}/theme-evidence/theme-login-mobile.png
            ${{ runner.temp }}/theme-evidence/theme-account.png
          if-no-files-found: warn

  production_tls:
    needs: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable inputs and pure contracts
        run: |
          python3 .github/browser/validate_inputs.py
          python3 -m unittest discover -s .github/browser -p 'test_*.py'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FULLSTACK_REF }}
          path: fullstack
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.GATEWAY_REF }}
          path: gateway
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install verified-browser test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          python3 -m pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium
      - name: Run isolated production TLS acceptance
        run: |
          set +e
          python3 .github/browser/production_tls.py
          result=$?
          python3 - "$result" <<'PYTHON'
          import json, pathlib, sys
          path = pathlib.Path("production-tls-results.json")
          data = json.loads(path.read_text())
          data["process_exit_code"] = int(sys.argv[1])
          if int(sys.argv[1]) != 0:
              data["status"] = "failed"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYTHON
          exit "$result"
      - name: Upload redacted production TLS result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-tls-results.json
          if-no-files-found: error

  bfcache:
    needs: production_tls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable inputs and pure contracts
        run: |
          python3 .github/browser/validate_inputs.py
          python3 -m unittest discover -s .github/browser -p 'test_*.py'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FULLSTACK_REF }}
          path: fullstack
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.GATEWAY_REF }}
          path: gateway
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install verified-browser test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          python3 -m pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium
      - name: Run controlled BFCache browser scenario
        run: |
          set +e
          python3 .github/browser/bfcache_probe.py
          result=$?
          python3 - "$result" <<'PYTHON'
          import json, pathlib, sys
          path = pathlib.Path("bfcache-results.json")
          data = json.loads(path.read_text())
          data["process_exit_code"] = int(sys.argv[1])
          if int(sys.argv[1]) != 0:
              data["status"] = "failed"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYTHON
          exit "$result"
      - name: Upload redacted BFCache observation only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfcache-${{ github.run_id }}-${{ github.run_attempt }}
          path: bfcache-results.json
          if-no-files-found: error
