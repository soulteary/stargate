name: Release compatibility harness tests

on:
  pull_request:
    paths:
      - '.github/compatibility/**'
      - '.github/workflows/release-compatibility*.yml'
  push:
    branches: [main]
    paths:
      - '.github/compatibility/**'
      - '.github/workflows/release-compatibility*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out harness tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check manifest and download boundaries
        run: python3 -m unittest discover -s .github/compatibility -p 'test_*.py' -v
